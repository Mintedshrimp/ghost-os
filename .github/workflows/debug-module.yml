name: Debug Module (Point Blank)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'module/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    branches: [ main ]
    paths:
      - 'module/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  # ============================================================
  # Lint
  # ============================================================
  lint:
    name: 📋 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/gradle-build-action@v3
      - run: ./gradlew :module:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: module-lint-results
          path: module/build/reports/lint-results*.html

  # ============================================================
  # Native Build (with corrected action input)
  # ============================================================
  build-native:
    name: 🔧 Native (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      # CORRECTED: Use 'accept-android-sdk-licenses' and 'packages'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;25.2.9519653
            cmake;3.22.1
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      
      - uses: gradle/gradle-build-action@v3
      
      - name: Build native for ${{ matrix.arch }}
        run: |
          ./gradlew :module:externalNativeBuildDebug \
            -Pandroid.injected.build.abi=${{ matrix.arch }} \
            --stacktrace
      
      - uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ matrix.arch }}
          path: module/build/intermediates/stripped_native_libs/debug/out/lib/${{ matrix.arch }}/

  # ============================================================
  # Build AAR
  # ============================================================
  build-module:
    name: 📦 Build AAR
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
          accept-android-sdk-licenses: true
      
      - uses: gradle/gradle-build-action@v3
      
      - run: ./gradlew :module:assembleDebug --stacktrace
      - run: ./gradlew :module:assembleRelease --stacktrace
      
      - uses: actions/upload-artifact@v4
        with:
          name: point-blank-debug
          path: module/build/outputs/aar/module-debug.aar
      
      - uses: actions/upload-artifact@v4
        with:
          name: point-blank-release
          path: module/build/outputs/aar/module-release.aar

  # ============================================================
  # Summary
  # ============================================================
  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: [lint, build-native, build-module]
    if: always()
    steps:
      - run: |
          echo "## Module Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Native | ${{ needs.build-native.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build AAR | ${{ needs.build-module.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.build-module.result }}" == "failure" ]]; then
            echo "❌ Module build failed"
            exit 1
          fi
