name: Debug Module (Point Blank)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'module/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    branches: [ main ]
    paths:
      - 'module/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  # ============================================================
  # JOB 1: Kotlin Lint & Static Analysis
  # ============================================================
  lint:
    name: 📋 Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/gradle-build-action@v3
      - name: Run lint
        run: ./gradlew :module:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: module-lint-results
          path: module/build/reports/lint-results*.html

  # ============================================================
  # JOB 2: Native Code Compilation (with SDK 34 fix)
  # ============================================================
  build-native:
    name: 🔧 Native (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      # FIX: Proper Android SDK setup with license acceptance
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;25.2.9519653
            cmake;3.22.1
          accept-licenses: 'android-sdk-license'
      
      # Verify SDK installation
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/platforms/ || echo "No platforms found"
          ls -la $ANDROID_HOME/build-tools/ || echo "No build-tools found"
      
      - uses: gradle/gradle-build-action@v3
      
      # Build native with explicit SDK path
      - name: Build native for ${{ matrix.arch }}
        run: |
          ./gradlew :module:externalNativeBuildDebug \
            -Pandroid.injected.build.abi=${{ matrix.arch }} \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2048m"
      
      - name: Verify .so files
        if: always()
        run: |
          find module/build -name "*.so" -type f 2>/dev/null | while read so; do
            echo "📦 $so"
            file "$so" || true
          done
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-libs-${{ matrix.arch }}
          path: module/build/intermediates/stripped_native_libs/debug/out/lib/${{ matrix.arch }}/

  # ============================================================
  # JOB 3: Full Module Compilation
  # ============================================================
  build-module:
    name: 📦 Build AAR
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
          accept-licenses: 'android-sdk-license'
      
      - uses: gradle/gradle-build-action@v3
      
      - name: Build debug AAR
        run: ./gradlew :module:assembleDebug --stacktrace
      
      - name: Build release AAR
        run: ./gradlew :module:assembleRelease --stacktrace
      
      - name: Upload debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: point-blank-debug
          path: module/build/outputs/aar/module-debug.aar
      
      - name: Upload release AAR
        uses: actions/upload-artifact@v4
        with:
          name: point-blank-release
          path: module/build/outputs/aar/module-release.aar

  # ============================================================
  # JOB 4: Unit Tests
  # ============================================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/gradle-build-action@v3
      - run: ./gradlew :module:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: module-test-results
          path: module/build/reports/tests/

  # ============================================================
  # JOB 5: Summary
  # ============================================================
  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: [lint, build-native, build-module, test]
    if: always()
    steps:
      - name: Generate report
        run: |
          echo "## Module Debug Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Native | ${{ needs.build-native.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-module.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.build-module.result }}" == "failure" ]]; then
            echo "❌ Module build failed"
            exit 1
          fi
