name: Debug Module (Point Blank)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'module/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    branches: [ main ]
    paths:
      - 'module/**'
  workflow_dispatch:
    inputs:
      debug_native:
        description: 'Build with native debug symbols'
        type: boolean
        default: true

env:
  JAVA_VERSION: '17'

jobs:
  lint:
    name: 📋 Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/gradle-build-action@v3
      - run: ./gradlew :module:lintDebug --stacktrace || echo "Lint issues found"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-lint-results
          path: |
            module/build/reports/lint-results*.html
            module/build/reports/lint-results*.xml

  build-native:
    name: 🔧 Native (${{ matrix.arch }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;25.2.9519653
            cmake;3.22.1
      - uses: gradle/gradle-build-action@v3
      - name: Build native
        id: build
        run: |
          ./gradlew :module:externalNativeBuildDebug \
            -Pandroid.injected.build.abi=${{ matrix.arch }} \
            --stacktrace
        continue-on-error: true
      - if: steps.build.outcome == 'success'
        run: |
          find module/build/intermediates -name "*.so" -type f 2>/dev/null | while read so; do
            echo "📦 $so"
            file "$so" || true
          done
      - if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ matrix.arch }}
          path: |
            module/build/intermediates/stripped_native_libs/debug/out/lib/${{ matrix.arch }}/
            module/build/intermediates/cmake/debug/obj/${{ matrix.arch }}/

  build-module:
    name: 📦 Build AAR
    runs-on: ubuntu-latest
    needs: [lint]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
      - uses: gradle/gradle-build-action@v3
      - name: Build debug AAR
        id: build-debug
        run: ./gradlew :module:assembleDebug --stacktrace
        continue-on-error: true
      - if: steps.build-debug.outcome == 'success'
        run: ./gradlew :module:assembleRelease --stacktrace
        continue-on-error: true
      - if: steps.build-debug.outcome == 'success'
        run: |
          echo "📦 Debug AAR contents:"
          unzip -l module/build/outputs/aar/module-debug.aar 2>/dev/null | grep -E "(\.so|\.dex|AndroidManifest)" || echo "No .so/.dex files found"
      - if: steps.build-debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: point-blank-debug
          path: module/build/outputs/aar/module-debug.aar
      - if: steps.build-debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: point-blank-release
          path: module/build/outputs/aar/module-release.aar

  verify-deps:
    name: 🔒 Dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/gradle-build-action@v3
      - run: ./gradlew :module:dependencies --configuration releaseRuntimeClasspath 2>/dev/null | head -50 || echo "Dependency check skipped"
      - run: |
          echo "📦 Required: Xposed API, Shizuku API, Javassist"
          grep -E "(xposed|shizuku|javassist)" module/build.gradle.kts || echo "⚠️ Some dependencies may be missing"

  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: [lint, build-native, build-module, verify-deps]
    if: always()
    steps:
      - name: Generate report
        run: |
          get_status() {
            case "$1" in
              "success") echo "✅" ;;
              "failure") echo "❌" ;;
              "skipped") echo "⏭️" ;;
              "cancelled") echo "🚫" ;;
              *) echo "⚠️" ;;
            esac
          }
          
          LINT="${{ needs.lint.result }}"
          NATIVE="${{ needs.build-native.result }}"
          MODULE="${{ needs.build-module.result }}"
          DEPS="${{ needs.verify-deps.result }}"
          
          echo "## 🐛 Module Debug Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Lint | $(get_status $LINT) $LINT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Native | $(get_status $NATIVE) $NATIVE |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Build | $(get_status $MODULE) $MODULE |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Deps | $(get_status $DEPS) $DEPS |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$MODULE" == "success" ]]; then
            echo "✅ Module built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Module build failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
